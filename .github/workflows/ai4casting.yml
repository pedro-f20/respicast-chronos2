name: Weekly AI4Casting submission

# Runs the pedro-f20/hub-forecasts code with this repo's RESPICAST_TOKEN
# (classic token, public_repo scope), so no second secret is needed.

on:
  schedule:
    # PHO data lands Friday afternoon Toronto; deadline Saturday 23:30 Toronto (03:30-04:30 UTC Sunday)
    - cron: "30 21 * * 5"
    - cron: "0 12 * * 6"
    - cron: "0 18 * * 6"
    - cron: "0 23 * * 6"
  workflow_dispatch:
    inputs:
      ref:
        description: "Round (Saturday, YYYY-MM-DD); default the coming Saturday"
        required: false
      dry_run:
        description: "Forecast only, no PR"
        type: boolean
        default: false

concurrency:
  group: ai4casting
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pedro-f20/hub-forecasts
          path: hub-forecasts

      - uses: astral-sh/setup-uv@v6

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chronos-2-29ec3766d36d6f73f0696f85560a422f50e8498c

      - name: Install
        working-directory: hub-forecasts
        run: |
          uv venv --python 3.12
          uv pip install --torch-backend cpu -r requirements.txt

      - name: Forecast and submit
        working-directory: hub-forecasts
        env:
          GH_TOKEN: ${{ secrets.RESPICAST_TOKEN }}
          REF: ${{ inputs.ref }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # the 23:00 UTC Saturday run is the last before the deadline
          FINAL: ${{ github.event.schedule == '0 23 * * 6' && '1' || '' }}
        run: bash submit.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai4casting-forecast
          path: hub-forecasts/out-*/
          if-no-files-found: ignore

      - name: Record submission in hub-forecasts
        working-directory: hub-forecasts
        env:
          GH_TOKEN: ${{ secrets.RESPICAST_TOKEN }}
        run: |
          git diff --quiet submissions.csv && exit 0
          git config user.name pedro-f20
          git config user.email 250035667+pedro-f20@users.noreply.github.com
          git commit -q -am "Record submission"
          git pull -q --rebase "https://x-access-token:$GH_TOKEN@github.com/pedro-f20/hub-forecasts.git" main
          git push -q "https://x-access-token:$GH_TOKEN@github.com/pedro-f20/hub-forecasts.git" HEAD:main
