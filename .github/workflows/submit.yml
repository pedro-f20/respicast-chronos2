name: Weekly RespiCast submission

on:
  schedule:
    # Hub data lands Friday ~21:45-22:45 UTC; the deadline is Wednesday 23:59 CET/CEST (21:59-22:59 UTC).
    # GitHub starts scheduled runs up to ~4 h late, so the last run is early on Wednesday.
    - cron: "17 23 * * 5"
    - cron: "17 9 * * 6"
    - cron: "17 6 * * 1"
    - cron: "17 6 * * 2"
    - cron: "17 6 * * 3"
  workflow_dispatch:
    inputs:
      origin:
        description: "Round (Wednesday, YYYY-MM-DD); default next Wednesday"
        required: false
      dry_run:
        description: "Forecast only, no PR"
        type: boolean
        default: false

permissions:
  contents: write  # appends to submissions.csv, which also keeps the schedule from going idle

concurrency:
  group: submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chronos-2-29ec3766d36d6f73f0696f85560a422f50e8498c

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install --torch-backend cpu -r requirements.lock  # full pinned set: no drift mid-season

      - name: Forecast and submit
        env:
          GH_TOKEN: ${{ secrets.RESPICAST_TOKEN }}
          ORIGIN: ${{ inputs.origin }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # the Wednesday run is the last before the deadline
          FINAL: ${{ github.event.schedule == '17 6 * * 3' && '1' || '' }}
        run: bash submit.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast
          path: out/
          if-no-files-found: ignore

      - name: Record submission
        if: always()  # keep the record of an opened PR even if a later step failed
        run: |
          git diff --quiet submissions.csv && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -q -am "Record submission"
          git pull -q --rebase
          git push -q
